name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Archive app (unsigned)
        run: |
          set -euo pipefail
          ARCHIVE="${GITHUB_WORKSPACE}/PayWallet.xcarchive"

          xcodebuild archive \
            -project PayWallet.xcodeproj \
            -scheme PayWallet \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "${ARCHIVE}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            ASSETCATALOG_COMPILER_APPICON_NAME="" \
            ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=YES

          echo "=== xcarchive contents ==="
          find "${ARCHIVE}" -maxdepth 4 | head -30

      - name: Package IPA
        run: |
          set -euo pipefail
          ARCHIVE="${GITHUB_WORKSPACE}/PayWallet.xcarchive"
          APP_PATH="${ARCHIVE}/Products/Applications/PayWallet.app"

          if [ ! -d "${APP_PATH}" ]; then
            echo "ERROR: .app not in expected xcarchive path. Full tree:"
            find "${ARCHIVE}" | head -60
            exit 1
          fi

          # Fix Info.plist if missing
          PLIST="${APP_PATH}/Info.plist"
          if [ ! -f "${PLIST}" ]; then
            echo "Injecting Info.plist..."
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string PayWallet"          "${PLIST}"
            /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string PayWallet"           "${PLIST}"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.paywallet.app"   "${PLIST}"
            /usr/libexec/PlistBuddy -c "Add :CFBundleInfoDictionaryVersion string 6.0"      "${PLIST}"
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string PayWallet"                 "${PLIST}"
            /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL"               "${PLIST}"
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0"         "${PLIST}"
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1"                      "${PLIST}"
            /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 16.0"                  "${PLIST}"
            /usr/libexec/PlistBuddy -c "Add :LSRequiresIPhoneOS bool true"                  "${PLIST}"
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false"      "${PLIST}"
            /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict"                           "${PLIST}"
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array"        "${PLIST}"
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "${PLIST}"
            echo "Plist injected ✅"
          else
            echo "Info.plist present ✅"
            cat "${PLIST}"
          fi

          # Inject icon
          ICON="${GITHUB_WORKSPACE}/PayWallet/icon.png"
          [ -f "${ICON}" ] && cp "${ICON}" "${APP_PATH}/AppIcon60x60@2x.png" && echo "Icon injected ✅"

          mkdir -p Payload
          cp -r "${APP_PATH}" Payload/
          zip -r PayWallet.ipa Payload

          echo "IPA size: $(du -sh PayWallet.ipa)"
          unzip -l PayWallet.ipa | grep -i "info.plist" || { echo "ERROR: Info.plist not in IPA!"; exit 1; }

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PayWallet-iOS-IPA
          path: PayWallet.ipa
          if-no-files-found: error
