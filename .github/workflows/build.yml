name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Assets.xcassets structure
        run: |
          mkdir -p PayWallet/Assets.xcassets/AppIcon.appiconset
          if [ ! -f PayWallet/Assets.xcassets/Contents.json ]; then
            echo '{"info":{"author":"xcode","version":1}}' > PayWallet/Assets.xcassets/Contents.json
          fi
          if [ ! -f PayWallet/Assets.xcassets/AppIcon.appiconset/Contents.json ]; then
            echo '{"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > PayWallet/Assets.xcassets/AppIcon.appiconset/Contents.json
          fi
          if [ ! -f PayWallet/Assets.xcassets/AppIcon.appiconset/icon.png ] && [ -f PayWallet/icon.png ]; then
            cp PayWallet/icon.png PayWallet/Assets.xcassets/AppIcon.appiconset/icon.png
          fi
          find . -not -path "./.git/*" -type f | sort

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project PayWallet.xcodeproj -scheme PayWallet \
            -configuration Release -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | tail -n 60

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PayWallet.app Payload/
          zip -qry PayWallet.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PayWallet-ipa
          path: PayWallet.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
