name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Install tools
        run: |
          brew install xcodegen
          gem install xcpretty --no-document

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project PayWallet.xcodeproj \
            -scheme PayWallet

      - name: Build unsigned .app
        run: |
          BUILD_DIR="${{ github.workspace }}/build"
          xcodebuild clean build \
            -project PayWallet.xcodeproj \
            -scheme PayWallet \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            SYMROOT="${BUILD_DIR}" \
            OBJROOT="${BUILD_DIR}/obj" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true

      - name: Find and package .app into IPA
        run: |
          APP_PATH=$(find "${{ github.workspace }}/build" -name "*.app" -type d | grep -v ".xctest" | head -1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found! Listing build dir:"
            find "${{ github.workspace }}/build" -maxdepth 5 | head -50
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r PayWallet.ipa Payload
          echo "IPA size: $(du -sh PayWallet.ipa)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayWallet-iOS-IPA
          path: PayWallet.ipa
          if-no-files-found: error
