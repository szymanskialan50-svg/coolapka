name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project PayWallet.xcodeproj \
            -scheme PayWallet

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          BUILD_DIR="${GITHUB_WORKSPACE}/build"
          mkdir -p "${BUILD_DIR}"

          xcodebuild build \
            -project PayWallet.xcodeproj \
            -scheme PayWallet \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="${BUILD_DIR}" \
            OBJROOT="${BUILD_DIR}/obj" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            VALID_ARCHS="arm64" \
            ASSETCATALOG_COMPILER_APPICON_NAME="" \
            ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=YES

          echo "=== Build dir contents ==="
          find "${BUILD_DIR}" -maxdepth 5 \( -name "*.app" -o -name "Info.plist" \) | head -40

      - name: Verify Info.plist and package IPA
        run: |
          set -euo pipefail
          BUILD_DIR="${GITHUB_WORKSPACE}/build"

          APP_PATH=$(find "${BUILD_DIR}" -name "*.app" -type d | grep -v "\.xctest" | head -1)
          echo "App path: ${APP_PATH}"

          if [ -z "${APP_PATH}" ]; then
            echo "ERROR: No .app found. Full build tree:"
            find "${BUILD_DIR}" | head -100
            exit 1
          fi

          PLIST="${APP_PATH}/Info.plist"

          if [ ! -f "${PLIST}" ]; then
            echo "Info.plist missing — injecting..."
            GEN=$(find "${GITHUB_WORKSPACE}" -path "*/Config/Info.plist" | head -1)
            if [ -n "${GEN}" ]; then
              cp "${GEN}" "${PLIST}"
              echo "Copied from ${GEN}"
            else
              /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string PayWallet"       "${PLIST}"
              /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string PayWallet"        "${PLIST}"
              /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.paywallet.app" "${PLIST}"
              /usr/libexec/PlistBuddy -c "Add :CFBundleInfoDictionaryVersion string 6.0"   "${PLIST}"
              /usr/libexec/PlistBuddy -c "Add :CFBundleName string PayWallet"              "${PLIST}"
              /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL"            "${PLIST}"
              /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0"      "${PLIST}"
              /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1"                   "${PLIST}"
              /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 16.0"               "${PLIST}"
              /usr/libexec/PlistBuddy -c "Add :LSRequiresIPhoneOS bool true"               "${PLIST}"
              /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false"   "${PLIST}"
              /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict"                        "${PLIST}"
              /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Aparat służy do skanowania karty.'" "${PLIST}"
              /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Face ID potwierdza platnosci.'"     "${PLIST}"
              /usr/libexec/PlistBuddy -c "Add :NFCReaderUsageDescription string 'NFC do odczytu karty.'"           "${PLIST}"
              /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array"     "${PLIST}"
              /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "${PLIST}"
              echo "Built minimal plist via PlistBuddy"
            fi
          else
            echo "Info.plist already present ✅"
          fi

          echo "=== Final Info.plist ==="
          cat "${PLIST}"

          # Inject app icon manually (actool disabled to avoid simulator runtime bug)
          ICON_SRC="${GITHUB_WORKSPACE}/PayWallet/icon.png"
          if [ -f "${ICON_SRC}" ]; then
            cp "${ICON_SRC}" "${APP_PATH}/AppIcon60x60@2x.png"
            cp "${ICON_SRC}" "${APP_PATH}/AppIcon76x76@2x~ipad.png"
            echo "✅ Icon injected"
          fi

          mkdir -p Payload
          cp -r "${APP_PATH}" Payload/
          zip -r PayWallet.ipa Payload
          echo "IPA size: $(du -sh PayWallet.ipa)"
          unzip -l PayWallet.ipa | grep "Info.plist"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PayWallet-iOS-IPA
          path: PayWallet.ipa
          if-no-files-found: error
